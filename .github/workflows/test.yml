name: test

on:
  push:
    paths: ['Formula/**']
  schedule:
    - cron: '17 6 * * 1' # brew's node will move to 27; catch the ABI break before a user does
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - run: brew --version
      # trust explicitly rather than relying on a fully qualified install to do it: that is only
      # non-interactive from Homebrew 6.1, and the prompt has nothing to read on a runner
      - run: brew tap leonid-shutov/tap
      - run: brew trust --formula leonid-shutov/tap/tuigram
      - run: brew install --verbose leonid-shutov/tap/tuigram
      - run: brew test --verbose leonid-shutov/tap/tuigram
